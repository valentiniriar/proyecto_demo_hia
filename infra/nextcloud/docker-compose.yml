# Nextcloud para GymHub (SCRUM-73/74): repositorio de informes del equipo y destino de los informes IA de n8n.
#
# Primera vez (crea .env con claves aleatorias, instala y configura grupos, usuarios y carpetas):
#   bash infra/nextcloud/setup.sh
# Uso diario:
#   docker compose -f infra/nextcloud/docker-compose.yml --env-file infra/nextcloud/.env up -d
#   → http://localhost:8082  (solo desde esta PC; remoto por Tailscale, SCRUM-61. NO se publica a Internet ni a la LAN)
#
# n8n se conecta por la red "gymhub_tools_net": http://nextcloud/remote.php/dav/files/n8n-bot/Informes-IA/
# Datos en volúmenes con nombre (no en carpetas del repo): `down` los conserva, `down -v` los borra.
# Grupo "gymhub-herramientas" en Docker Desktop (con Mantis, n8n y el puente a la base).
name: gymhub-herramientas

services:
  nextcloud-db:
    image: postgres:16-alpine
    container_name: gymhub-nextcloud-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASS:?Ejecutar infra/nextcloud/setup.sh o definir NEXTCLOUD_DB_PASS en infra/nextcloud/.env}
    volumes:
      - nextcloud_db:/var/lib/postgresql/data
    networks:
      - nextcloud_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  nextcloud:
    image: nextcloud:34-apache
    container_name: gymhub-nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASS:?Definir NEXTCLOUD_DB_PASS}
      # Instalación automática en el primer arranque (después la contraseña del admin vive en la BD).
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASS:?Definir NEXTCLOUD_ADMIN_PASS}
      # localhost/127.0.0.1: esta PC · nextcloud: n8n por la red tools · *.ts.net: Tailscale (SCRUM-61).
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1 nextcloud gymhub-servidor.tailec3350.ts.net
      PHP_UPLOAD_LIMIT: 512M
      PHP_MEMORY_LIMIT: 512M
      TZ: America/Argentina/Jujuy
    # Acceso restringido: solo localhost de la PC (administración remota por Tailscale, SCRUM-61).
    ports:
      - "127.0.0.1:${NEXTCLOUD_HOST_PORT:-8082}:80"
    volumes:
      - nextcloud_data:/var/www/html
      # cloud/gymhub.config.php (idioma, sin archivos de ejemplo…) lo copia cloud/bootstrap.sh a config/.
      # No se monta como archivo: Docker crearía config/ como root y la instalación no podría escribir config.php.
    networks:
      nextcloud_internal: {}
      tools:
        aliases: [nextcloud]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/status.php || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

networks:
  # BD de Nextcloud aislada: sin salida a Internet y sin otros servicios.
  nextcloud_internal:
    name: gymhub_nextcloud_internal
    internal: true
  # Red compartida con n8n y Mantis.
  tools:
    name: gymhub_tools_net

volumes:
  nextcloud_db:
    name: gymhub_nextcloud_db
  nextcloud_data:
    name: gymhub_nextcloud_data
