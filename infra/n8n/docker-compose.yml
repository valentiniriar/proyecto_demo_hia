name: gymhub-scrum75
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: gymhub-n8n-scrum75
    restart: 'no'
    # Editor/webhooks SOLO locales: nunca 0.0.0.0 ni puertos públicos.
    ports:
      - '127.0.0.1:${N8N_HOST_PORT:-5679}:5678'
    env_file:
      - .env
    environment:
      TZ: America/Argentina/Jujuy
      GENERIC_TIMEZONE: America/Argentina/Jujuy
      N8N_HOST: localhost
      N8N_PORT: '5678'
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_EDITOR_BASE_URL: 'http://localhost:${N8N_HOST_PORT:-5679}/'
      WEBHOOK_URL: 'http://localhost:${N8N_HOST_PORT:-5679}/'
      N8N_SECURE_COOKIE: 'false' # SOLO entorno local HTTP en 127.0.0.1
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: 'true'
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
