global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts/gymhub.rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: postgres-primary
    static_configs:
      - targets: ['postgres-exporter-primary:9187']
  - job_name: blackbox-exporter
    static_configs:
      - targets: ['blackbox-exporter:9115']
  - job_name: blackbox-local-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://host.docker.internal:3000/api/health'
          - 'http://host.docker.internal:8081/api/health'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'
# Pendiente: agregar scrape de la réplica PostgreSQL cuando exista.

  # SCRUM-85: disponibilidad de la URL pública (Cloudflare Tunnel) vista desde afuera.
  # Los targets se cargan desde archivo para no tocar esta config cuando cambia la URL
  # (el túnel rápido genera una nueva en cada arranque): infra/monitoring/publicar-target.sh
  - job_name: blackbox-publico
    scrape_interval: 30s
    metrics_path: /probe
    params:
      module: [https_publico]
    file_sd_configs:
      - files: ['/etc/prometheus/targets/publico.yml']
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'
  # SCRUM-85: métricas del propio túnel (conexiones activas, errores hacia el origen).
  - job_name: cloudflared
    file_sd_configs:
      - files: ['/etc/prometheus/targets/cloudflared.yml']
        refresh_interval: 30s
