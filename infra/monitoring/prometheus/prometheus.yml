global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: postgres-primary
    static_configs:
      - targets: ['postgres-exporter-primary:9187']
  - job_name: blackbox-exporter
    static_configs:
      - targets: ['blackbox-exporter:9115']
  - job_name: blackbox-local-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://host.docker.internal:3000/api/health'
          - 'http://host.docker.internal:8081/api/health'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'
# Pendiente: agregar scrape de la réplica PostgreSQL cuando exista.
# Pendiente: agregar URL pública con HTTPS cuando se publique la app.
