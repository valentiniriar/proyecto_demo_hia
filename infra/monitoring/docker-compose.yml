name: gymhub-scrum66
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: gymhub-prometheus-scrum66
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - '127.0.0.1:${PROM_HOST_PORT:-9090}:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: gymhub-alertmanager-scrum68
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - '127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [monitoring]

  grafana:
    image: grafana/grafana:12.1.1
    container_name: gymhub-grafana-scrum66
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_SERVER_ROOT_URL: 'http://localhost:${GRAFANA_HOST_PORT:-3001}/'
    ports:
      - '127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: gymhub-node-exporter-scrum66
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [monitoring]

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: gymhub-cadvisor-scrum66
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      # SOLO laboratorio local: acceso al socket Docker tiene alto privilegio.
      # El sufijo :ro no vuelve de solo lectura la API del daemon.
      - ${HOME}/.docker/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [monitoring]

  postgres-exporter-primary:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: gymhub-postgres-exporter-scrum66
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: 'host.docker.internal:${PG_HOST_PORT}/${PG_DB}?sslmode=disable'
      DATA_SOURCE_USER: ${PG_EXPORTER_USER}
      DATA_SOURCE_PASS: ${PG_EXPORTER_PASSWORD}
    networks: [monitoring]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    container_name: gymhub-blackbox-scrum66
    restart: unless-stopped
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks: [monitoring]

networks:
  monitoring:
    driver: bridge
volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
