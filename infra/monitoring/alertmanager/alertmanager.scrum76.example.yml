# SCRUM-76 example only: requires the Compose override with a secret file.
# Do not enable this configuration without the SCRUM76_WEBHOOK_TOKEN_FILE secret.
global:
  resolve_timeout: 5m
route:
  receiver: gymhub-n8n-scrum76
  group_by: ['alertname', 'component']
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h
receivers:
  - name: gymhub-n8n-scrum76
    webhook_configs:
      - url: 'http://gymhub-n8n-scrum75:5678/webhook/gymhub-scrum76-alertas'
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/scrum76_webhook_token
