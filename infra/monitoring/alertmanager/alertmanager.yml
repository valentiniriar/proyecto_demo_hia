global:
  resolve_timeout: 5m
route:
  receiver: gymhub-local-sin-notificaciones
  group_by: ['alertname', 'component']
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h
receivers:
  # SCRUM-76: conectar webhook autenticado de n8n cuando exista.
  # Hasta entonces las alertas se consultan en Prometheus/Alertmanager,
  # sin enviar datos a servicios externos o endpoints inexistentes.
  - name: gymhub-local-sin-notificaciones
