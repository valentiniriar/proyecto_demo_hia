# Monitoreo del stack de PRODUCCIÓN (proyecto Compose "gymhub", SCRUM-57/61).
# Se suma al compose de monitoreo; no cambia el modo de laboratorio original.
#
#   docker compose -f infra/monitoring/docker-compose.yml -f infra/monitoring/docker-compose.prod.yml up -d
#   (o: bash scripts/infra.sh levantar)
#
# Los exporters entran a las redes internas de producción (gymhub_prod_*): la base de producción
# sigue sin publicar puertos. El usuario de métricas (gymhub_monitor) solo tiene el rol pg_monitor.

services:
  prometheus:
    # Misma ruta destino: reemplaza al prometheus.yml de laboratorio por el de producción.
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
    # prod_db: para leer las métricas de Patroni de cada nodo (pg-1..3:8008).
    networks: [monitoring, prod_web, prod_db]

  cadvisor:
    # Docker Desktop (Windows/macOS) expone el socket del daemon en /var/run/docker.sock.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # "db" es HAProxy: el exporter mide siempre al líder del cluster Patroni, sea cual sea.
  # El rol y el atraso de cada réplica salen de las métricas de Patroni (job "patroni").
  postgres-exporter-primary:
    environment:
      DATA_SOURCE_URI: 'db:5432/${PG_DB}?sslmode=disable'
    networks: [monitoring, prod_db]

  blackbox-exporter:
    networks: [monitoring, prod_web]

  # Alertas → n8n (flujo 01) → Mantis + mail. n8n está en esta misma red (gymhub-monitoreo_monitoring).
  alertmanager:
    volumes:
      - ./alertmanager/alertmanager.prod.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets:
      - alertmanager_n8n_token

secrets:
  alertmanager_n8n_token:
    file: ./secrets/alertmanager_n8n_token

networks:
  prod_db:
    external: true
    name: gymhub_prod_db_net
  prod_web:
    external: true
    name: gymhub_prod_frontend_net
