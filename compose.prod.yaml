# Configuración de Producción (compose.prod.yaml - SCRUM-53, ajustado en SCRUM-57)
# Imágenes inmutables de GHCR, puertos de base de datos aislados de la red externa.
#
# IMAGE_TAG elige la versión a desplegar: el SHA del commit que publicó el CD (SCRUM-56).
# Así un despliegue o un rollback es "levantar el SHA X". Sin IMAGE_TAG se usa latest.
#
# Lo despliega scripts/deploy.sh (llamado por .github/workflows/cd.yml) como proyecto
# "gymhub-produccion" (grupo de Docker Desktop: app + cluster de base + backup + túnel):
#   IMAGE_TAG=<sha> docker compose -p gymhub-produccion --env-file produccion/.env.prod \
#     -f compose.yaml -f compose.prod.yaml -f compose.tunnel.yaml --profile prod up -d ...

services:
  frontend:
    # gymhub-web (no gymhub-frontend): ver el paso "Build y push" de .github/workflows/cd.yml
    image: ghcr.io/valentiniriar/gymhub-web:${IMAGE_TAG:-latest}
    container_name: gymhub_frontend_prod
    # Solo en localhost: desde Internet se entra por el túnel (red Docker), no por el puerto 80 del host.
    ports:
      - "127.0.0.1:80:8080"
    environment:
      NODE_ENV: production
      # Nginx llega al backend por la red interna de Docker.
      BACKEND_UPSTREAM: http://backend:3000

  backend:
    image: ghcr.io/valentiniriar/gymhub-backend:${IMAGE_TAG:-latest}
    container_name: gymhub_backend_prod
    depends_on:
      haproxy:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # "db" es HAProxy: 5432 lleva siempre al líder de Patroni y 5433 a las réplicas (o al líder).
      DB_HOST_PRIMARY: db
      DB_PORT_PRIMARY: 5432
      DB_HOST_REPLICA: db
      DB_PORT_REPLICA: 5433
      DB_NAME: ${DB_NAME:?DB_NAME no definida}
      DB_USER: ${DB_USER:?DB_USER no definida}
      DB_PASS: ${DB_PASS:?DB_PASS no definida}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET no definida}

  # Cluster Patroni de producción: ningún nodo ni HAProxy exponen puertos al host del servidor
  # (se entra por el puente 5436). Nombres propios para no chocar con los de desarrollo en la misma PC.
  etcd:
    container_name: gymhub_etcd_prod
  pg-1:
    container_name: gymhub_pg_1_prod
    environment:
      PATRONI_SCOPE: gymhub-prod
      PATRONI_SUPERUSER_USERNAME: ${DB_USER:?DB_USER no definida}
      PATRONI_SUPERUSER_PASSWORD: ${DB_PASS:?DB_PASS no definida}
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD:?PATRONI_RESTAPI_PASSWORD no definida}
  pg-2:
    container_name: gymhub_pg_2_prod
    environment:
      PATRONI_SCOPE: gymhub-prod
      PATRONI_SUPERUSER_USERNAME: ${DB_USER:?DB_USER no definida}
      PATRONI_SUPERUSER_PASSWORD: ${DB_PASS:?DB_PASS no definida}
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD:?PATRONI_RESTAPI_PASSWORD no definida}
  pg-3:
    container_name: gymhub_pg_3_prod
    environment:
      PATRONI_SCOPE: gymhub-prod
      PATRONI_SUPERUSER_USERNAME: ${DB_USER:?DB_USER no definida}
      PATRONI_SUPERUSER_PASSWORD: ${DB_PASS:?DB_PASS no definida}
      PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD:?PATRONI_RESTAPI_PASSWORD no definida}
  haproxy:
    container_name: gymhub_haproxy_prod
    # Página de estado (qué nodo es el líder, en verde) SOLO en localhost del servidor; se ve desde la
    # tailnet con scripts/tailscale-serve.sh. Es de solo lectura (sin "stats admin"). Los puertos de
    # PostgreSQL (5432/5433) siguen sin publicarse.
    ports:
      - "127.0.0.1:${HAPROXY_STATS_PORT:-7000}:7000"

  backup:
    container_name: gymhub_backup_prod

# Redes y volúmenes propios de producción: en el mismo servidor conviven los de desarrollo
# (gymhub_db_net, gymhub_db_data…) y producción nunca debe usar la base de desarrollo.
networks:
  frontend_net:
    name: gymhub_prod_frontend_net
  db_net:
    name: gymhub_prod_db_net

volumes:
  db_data:
    name: gymhub_prod_db_data
  db_replica_data:
    name: gymhub_prod_db_replica_data
  db_replica2_data:
    name: gymhub_prod_db_replica2_data
  etcd_data:
    name: gymhub_prod_etcd_data
  db_backups:
    name: gymhub_prod_db_backups
