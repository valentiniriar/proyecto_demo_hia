# Base de datos relacional (PostgreSQL) y herramientas de administración para el proyecto.
# Uso base:  docker compose up -d db
# Uso con pgAdmin: docker compose --profile tools up -d
# Los scripts de ./database se ejecutan automaticamente la PRIMERA vez que se crea el volumen.
# Para reiniciar la BD desde cero:  docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: demo_hia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-demo_hia}
      POSTGRES_USER: ${DB_USER:-demo_hia}
      POSTGRES_PASSWORD: ${DB_PASS:-demo_hia_pass}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Administrador web de la BD (pgAdmin 4 - SCRUM-34): docker compose --profile tools up -d
  # Publicado estrictamente en 127.0.0.1 para acceso interno / localhost
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: demo_hia_pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@gymhub.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin1234}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

  # Administrador web alternativo ligero (Adminer): docker compose --profile adminer up -d
  adminer:
    image: adminer:4
    container_name: demo_hia_adminer
    profiles: ["adminer"]
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  db_data:
  pgadmin_data:
