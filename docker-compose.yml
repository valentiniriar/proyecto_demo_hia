# Base de datos de desarrollo: cluster PostgreSQL con failover automático (Patroni + etcd + HAProxy).
# Ver docs/implementacion-patroni.MD.
#
# Requisito: archivo .env (no versionado) con DB_NAME, DB_USER y DB_PASS.
#   cp .env.example .env
#
# Perfiles:
#   Desarrollo (1 nodo, publica la BD en localhost:${DB_PORT:-5433}): docker compose -f docker-compose.yml --profile dev up -d
#   Cluster de 3 nodos (líder + 2 réplicas, failover):                docker compose -f docker-compose.yml --profile dev --profile cluster up -d
#   pgAdmin 4 (opcional, 127.0.0.1:${PGADMIN_PORT:-5050}):            ... --profile tools up -d
#   Adminer (opcional, 127.0.0.1:8080):                               ... --profile adminer up -d
#   Backups automáticos (SCRUM-37):                                   ... --profile backups up -d
#
# "-f docker-compose.yml" es necesario: en la carpeta también está compose.yaml (Forma B / producción) y
# Compose lo elegiría por defecto.
#
# La app NO se conecta a un nodo: se conecta a HAProxy, que tiene el nombre de red "db" y publica
#   localhost:${DB_PORT:-5433}         → siempre el líder (escrituras)
#   localhost:${DB_REPLICA_PORT:-5434} → réplicas o líder (lecturas)
#   localhost:${HAPROXY_STATS_PORT:-7000} → página de estado: qué nodo es el líder
# Así, cuando un nodo cae y otro toma el control, backend/.env y pgAdmin no cambian.
#
# El esquema y el seed de ./database se cargan solo si el volumen de pg-1 está vacío (cluster nuevo).
# Para reiniciar la BD desde cero:  docker compose -f docker-compose.yml --profile dev --profile cluster down -v

x-patroni-node: &patroni-node
  build:
    context: ./database/patroni
  image: gymhub-patroni:16
  restart: unless-stopped
  # SCRUM-39: Docker limita /dev/shm a 64 MB y los hash join paralelos sobre 6M filas fallan con
  # "could not resize shared memory segment ... No space left on device".
  shm_size: 256mb
  depends_on:
    etcd:
      condition: service_started
  environment: &patroni-env
    PATRONI_SCOPE: gymhub-dev
    PATRONI_ETCD3_HOSTS: etcd:2379
    PATRONI_SUPERUSER_USERNAME: ${DB_USER:?DB_USER no definida en .env}
    PATRONI_SUPERUSER_PASSWORD: ${DB_PASS:?DB_PASS no definida en .env}
    PATRONI_REPLICATION_USERNAME: ${POSTGRES_REPLICA_USER:-replicator}
    PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICA_PASSWORD:-replicator_pass}
    PATRONI_RESTAPI_USERNAME: ${PATRONI_RESTAPI_USERNAME:-patroni}
    PATRONI_RESTAPI_PASSWORD: ${PATRONI_RESTAPI_PASSWORD:-patroni_pass}
    DB_NAME: ${DB_NAME:?DB_NAME no definida en .env}
  healthcheck:
    # 200 si PostgreSQL está corriendo en este nodo (sea líder o réplica).
    test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8008/health"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 30s
  networks:
    - gymhub_db_net
  deploy:
    resources:
      limits:
        memory: 1024M

services:
  # Guarda quién es el líder (un lock con vencimiento). No guarda datos de la app.
  # Un solo nodo para ahorrar recursos: si se cae, el líder pasa a solo lectura (limitación documentada).
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: demo_hia_etcd
    profiles: ["dev"]
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
    volumes:
      - etcd_data:/etcd-data
    networks:
      - gymhub_db_net

  # Nodo 1. Usa el volumen de datos de siempre (db_data): si ya tiene datos, Patroni los adopta.
  pg-1:
    <<: *patroni-node
    container_name: demo_hia_pg_1
    profiles: ["dev"]
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-1:5432
    volumes:
      - ./database/patroni/patroni.yml:/etc/patroni/patroni.yml:ro
      - ./database/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./database/01_schema.sql:/scripts/sql/01_schema.sql:ro
      - ./database/02_seed.sql:/scripts/sql/02_seed.sql:ro
      - db_data:/var/lib/postgresql/data

  # Nodos 2 y 3 (perfil cluster): arrancan vacíos y Patroni los clona del líder.
  pg-2:
    <<: *patroni-node
    container_name: demo_hia_pg_2
    profiles: ["cluster"]
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-2:5432
    volumes:
      - ./database/patroni/patroni.yml:/etc/patroni/patroni.yml:ro
      - ./database/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./database/01_schema.sql:/scripts/sql/01_schema.sql:ro
      - ./database/02_seed.sql:/scripts/sql/02_seed.sql:ro
      - db_replica_data:/var/lib/postgresql/data

  pg-3:
    <<: *patroni-node
    container_name: demo_hia_pg_3
    profiles: ["cluster"]
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg-3
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-3:5432
    volumes:
      - ./database/patroni/patroni.yml:/etc/patroni/patroni.yml:ro
      - ./database/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./database/01_schema.sql:/scripts/sql/01_schema.sql:ro
      - ./database/02_seed.sql:/scripts/sql/02_seed.sql:ro
      - db_replica2_data:/var/lib/postgresql/data

  # Punto de entrada único a la base: "db" para los contenedores, puertos 5433/5434 para la PC.
  haproxy:
    image: haproxy:3.2.4-alpine
    container_name: demo_hia_haproxy
    profiles: ["dev"]
    restart: unless-stopped
    volumes:
      - ./database/patroni/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # SCRUM-61: la base solo se publica en la PC local, nunca en la LAN.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
      - "127.0.0.1:${DB_REPLICA_PORT:-5434}:5433"
      - "127.0.0.1:${HAPROXY_STATS_PORT:-7000}:7000"
    networks:
      gymhub_db_net:
        aliases:
          - db
      # La red interna no permite publicar puertos; esta red solo sirve para exponerlos al host.
      default: {}

  # Servicio de backups automáticos (SCRUM-37)
  # Genera dumps en formato custom (-F c) y JSON de estado para n8n
  backup:
    build:
      context: ./database/backup
    image: gymhub-backup:latest
    container_name: demo_hia_backup
    profiles: ["backups", "tools"]
    restart: unless-stopped
    depends_on:
      haproxy:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-demo_hia}
      DB_USER: ${DB_USER:-demo_hia}
      DB_PASS: ${DB_PASS:-demo_hia_pass}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      RUN_BACKUP_ON_STARTUP: ${RUN_BACKUP_ON_STARTUP:-true}
    volumes:
      - db_backups:/backups
    networks:
      - gymhub_db_net

  # Administrador web de la BD (pgAdmin 4 - SCRUM-34): docker compose --profile dev --profile tools up -d
  # Publicado estrictamente en 127.0.0.1 para acceso interno / localhost
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: demo_hia_pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      haproxy:
        condition: service_started
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL no definida en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD no definida en .env}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      # gymhub_db_net para llegar al host "db"; default para poder publicar el puerto.
      - gymhub_db_net
      - default
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

  # Administrador web alternativo ligero (Adminer): docker compose --profile adminer up -d
  adminer:
    image: adminer:4
    container_name: demo_hia_adminer
    profiles: ["adminer"]
    restart: unless-stopped
    depends_on:
      haproxy:
        condition: service_started
    networks:
      - gymhub_db_net
      - default
    ports:
      - "127.0.0.1:8080:8080"

networks:
  gymhub_db_net:
    name: gymhub_db_net
    driver: bridge
    internal: true

volumes:
  db_data:
  db_replica_data:
  db_replica2_data:
  etcd_data:
  pgadmin_data:
  db_backups:
