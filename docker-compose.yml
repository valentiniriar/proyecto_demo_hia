# Base de datos relacional (PostgreSQL) para el proyecto.
#
# Requisito: archivo .env (no versionado) con DB_NAME, DB_USER y DB_PASS.
#   cp .env.example .env
#
# Perfiles:
#   Desarrollo (publica la BD en localhost:${DB_PORT:-5433}):  docker compose --profile dev up -d
#   Despliegue (BD sin puerto en el host, solo red interna):   docker compose --profile deploy up -d
#   Clúster Replicado (SCRUM-45):                             docker compose --profile dev --profile cluster up -d
#   pgAdmin 4 (opcional, 127.0.0.1:${PGADMIN_PORT:-5050}):     docker compose --profile dev --profile tools up -d
#   Adminer (opcional, 127.0.0.1:8080):                        docker compose --profile dev --profile adminer up -d
#   Backups automáticos (SCRUM-37):                            docker compose --profile dev --profile backups up -d
#
# No levantar dev y deploy a la vez: comparten el volumen db_data.
# Los scripts de ./database se ejecutan automaticamente la PRIMERA vez que se crea el volumen.
# Para reiniciar la BD desde cero:  docker compose --profile dev down -v && docker compose --profile dev up -d

x-db-base: &db-base
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
    POSTGRES_DB: ${DB_NAME:?DB_NAME no definida en .env}
    POSTGRES_USER: ${DB_USER:?DB_USER no definida en .env}
    POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS no definida en .env}
    POSTGRES_REPLICA_USER: ${POSTGRES_REPLICA_USER:-replicator}
    POSTGRES_REPLICA_PASSWORD: ${POSTGRES_REPLICA_PASSWORD:-replicator_pass}
  volumes:
    - db_data:/var/lib/postgresql/data
    - ./database/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    - ./database/replication/setup-primary.sh:/docker-entrypoint-initdb.d/03_setup_primary.sh:ro
  command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 10s
  networks:
    - gymhub_db_net

services:
  # Despliegue: el puerto de la BD NO se publica hacia el host.
  db:
    <<: *db-base
    container_name: demo_hia_db
    profiles: ["deploy"]

  # Desarrollo: igual que db, pero publica el puerto para el backend local.
  db-dev:
    <<: *db-base
    container_name: demo_hia_db_dev
    profiles: ["dev"]
    ports:
      - "${DB_PORT:-5433}:5432"
    networks:
      gymhub_db_net:
        aliases:
          - db
      # La red interna no permite publicar puertos; esta red solo sirve para exponer 5433 al host.
      default: {}

  # NODO RÉPLICA STANDBY (Solo Lectura, Streaming físico - SCRUM-45)
  db-replica:
    image: postgres:16-alpine
    container_name: demo_hia_db_replica
    profiles: ["cluster"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false
      db-dev:
        condition: service_healthy
        required: false
    environment:
      PRIMARY_HOST: db
      PRIMARY_PORT: 5432
      POSTGRES_REPLICA_USER: ${POSTGRES_REPLICA_USER:-replicator}
      POSTGRES_REPLICA_PASSWORD: ${POSTGRES_REPLICA_PASSWORD:-replicator_pass}
      REPLICATION_SLOT: standby_slot_1
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_REPLICA_PORT:-5434}:5432"
    volumes:
      - db_replica_data:/var/lib/postgresql/data
      - ./database/replication/entrypoint-replica.sh:/scripts/entrypoint-replica.sh:ro
    entrypoint: ["/scripts/entrypoint-replica.sh"]
    networks:
      - gymhub_db_net
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_REPLICA_USER} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de backups automáticos (SCRUM-37)
  # Genera dumps en formato custom (-F c) y JSON de estado para n8n
  backup:
    build:
      context: ./database/backup
    image: gymhub-backup:latest
    container_name: demo_hia_backup
    profiles: ["backups", "tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false
      db-dev:
        condition: service_healthy
        required: false
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-demo_hia}
      DB_USER: ${DB_USER:-demo_hia}
      DB_PASS: ${DB_PASS:-demo_hia_pass}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      RUN_BACKUP_ON_STARTUP: ${RUN_BACKUP_ON_STARTUP:-true}
    volumes:
      - db_backups:/backups
    networks:
      - gymhub_db_net

  # Administrador web de la BD (pgAdmin 4 - SCRUM-34): docker compose --profile dev --profile tools up -d
  # Publicado estrictamente en 127.0.0.1 para acceso interno / localhost
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: demo_hia_pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false
      db-dev:
        condition: service_healthy
        required: false
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL no definida en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD no definida en .env}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      # gymhub_db_net para llegar al host "db"; default para poder publicar el puerto.
      - gymhub_db_net
      - default
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"

  # Administrador web alternativo ligero (Adminer): docker compose --profile adminer up -d
  adminer:
    image: adminer:4
    container_name: demo_hia_adminer
    profiles: ["adminer"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
        required: false
      db-dev:
        condition: service_healthy
        required: false
    networks:
      - gymhub_db_net
      - default
    ports:
      - "127.0.0.1:8080:8080"

networks:
  gymhub_db_net:
    name: gymhub_db_net
    driver: bridge
    internal: true

volumes:
  db_data:
  db_replica_data:
  pgadmin_data:
  db_backups:
