# ----------------------------------------------------------------------
# Configuración optimizada de PostgreSQL 16 para GymHub
# Ticket: SCRUM-43 · Perfil: Web Application / OLTP (2GB-4GB RAM contenedor)
# Preparado para Streaming Replication (SCRUM-45) y Monitoreo (SCRUM-66)
# ----------------------------------------------------------------------

# CONECTIVIDAD Y RED
listen_addresses = '*'
max_connections = 100

# MEMORIA (Calculado según recomendaciones PGTune para OLTP)
shared_buffers = 512MB                  # 25% de la RAM del contenedor para buffer cache
effective_cache_size = 1536MB           # 75% de la RAM disponible para estimador del optimizador
work_mem = 10MB                         # Memoria por operación de ordenamiento/hash (100 conex * 10MB = 1GB max)
maintenance_work_mem = 128MB            # Memoria para VACUUM, CREATE INDEX, ALTER TABLE

# COSTOS DEL PLANIFICADOR (Optimizado para SSD / Almacenamiento rápido en contenedores)
random_page_cost = 1.1                  # Por defecto 4.0; 1.1 favorece escaneo por índices en SSD/NVMe
effective_io_concurrency = 200          # Concurrencia de I/O recomendada para almacenamiento moderno

# WRITE-AHEAD LOGGING (WAL) Y REPLICACIÓN (Habilita streaming replication para SCRUM-45)
wal_level = replica                     # Nivel necesario para physical streaming replication
max_wal_size = 2GB                      # Umbral para checkpoints automáticos
min_wal_size = 512MB
checkpoint_completion_target = 0.9      # Distribuye escrituras de checkpoint para suavizar picos de I/O
checkpoint_timeout = 10min              # Intervalo entre checkpoints
max_wal_senders = 10                    # Procesos simultáneos de transmisión WAL
max_replication_slots = 10              # Slots de replicación físicos para réplicas
wal_keep_size = 512MB                   # Cantidad mínima de WAL retenida en pg_wal para réplicas retrasadas
archive_mode = off                      # No archiving local mientras se use streaming directo

# AUTOVACUUM (Ajuste agresivo para mitigar bloat en tablas con updates frecuentes)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s                # Intervalo de revisión del daemon de autovacuum
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1    # Dispara vacuum al modificarse el 10% de la tabla
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05   # Dispara analyze al modificarse el 5% de la tabla
autovacuum_vacuum_cost_limit = 500      # Aumenta rendimiento de autovacuum durante I/O

# LOGGING Y DIAGNÓSTICO
logging_collector = off                 # Salida directa a stderr/stdout para docker logs
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# LOCALE
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
