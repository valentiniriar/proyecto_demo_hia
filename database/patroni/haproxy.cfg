# HAProxy delante del cluster Patroni: la app se conecta siempre a "db" y HAProxy decide a qué nodo va.
# Para saber quién es quién le pregunta a la API REST de Patroni de cada nodo (puerto 8008):
#   OPTIONS /primary   → 200 solo en el líder
#   OPTIONS /read-only → 200 en el líder y en las réplicas que estén funcionando
# (OPTIONS y no GET: responde sin cuerpo, así HAProxy no corta la conexión a mitad de la respuesta y
# Patroni no llena el log con ConnectionResetError)
# Tras un failover, en ~4 s (inter 2s × fall 2) el viejo líder sale y el nuevo entra, y se cortan las
# conexiones abiertas al nodo caído para que el backend reconecte al nuevo líder.

global
    maxconn 300

# DNS interno de Docker: los nodos que no existen todavía (perfil dev sin pg-2/pg-3) no impiden arrancar;
# HAProxy los resuelve cuando aparecen.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

defaults
    mode tcp
    log stdout format raw local0
    retries 2
    timeout connect 4s
    timeout client 30m
    timeout server 30m
    timeout check 2s

# Página de estado: qué nodo está en verde (líder) en cada puerto.
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 2s

# Escrituras (y todo lo que no distingue): siempre al líder.
listen primary
    bind *:5432
    option httpchk OPTIONS /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr none
    server pg-1 pg-1:5432 check port 8008
    server pg-2 pg-2:5432 check port 8008
    server pg-3 pg-3:5432 check port 8008

# Lecturas: réplicas y líder (con un solo nodo levantado, las lecturas siguen andando).
listen replicas
    bind *:5433
    balance roundrobin
    option httpchk OPTIONS /read-only
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr none
    server pg-1 pg-1:5432 check port 8008
    server pg-2 pg-2:5432 check port 8008
    server pg-3 pg-3:5432 check port 8008
