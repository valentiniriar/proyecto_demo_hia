server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sin versión de Nginx en cabeceras ni páginas de error (ZAP 10036, SCRUM-81).
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # SCRUM-81 (ZAP 10055): orígenes externos explícitos en lugar del comodín "https:".
    #   accounts.google.com -> Google Sign-In · youtube -> videos de ejercicios · google maps -> mapa de la sede
    # Las imágenes siguen admitiendo https: (miniaturas de YouTube y fotos de Open Food Facts).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # ZAP 10063: la app no usa cámara, micrófono, geolocalización ni pagos del navegador.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    # ZAP 90004: aislamiento entre orígenes. "allow-popups" mantiene funcionando el popup de Google Sign-In.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location /api/ {
        # BACKEND_UPSTREAM se reemplaza al iniciar el contenedor (envsubst de la imagen de Nginx).
        # Default (Dockerfile): http://host.docker.internal:3000 · Detrás del túnel: http://backend:3000
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
