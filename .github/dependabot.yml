# Dependabot (SCRUM-58): PRs automáticos de actualización hacia develop.
# - npm: backend y frontend (las de seguridad llegan además por las alertas de Dependabot).
# - docker: imágenes base de los Dockerfile.
# - github-actions: mantiene al día los SHA fijados en los workflows.
# Los PRs de Dependabot pasan por el mismo CI y revisión que cualquier otro.
version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
    labels: [dependencias, backend]
    groups:
      backend-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    labels: [dependencias, frontend]
    # Angular exige la MISMA versión mayor en todos sus paquetes. Dependabot proponía saltos mayores
    # sueltos (ej. #91: solo @angular/cli 21 → 22, con el resto en 21 y el lockfile roto). Las versiones
    # mayores de Angular se migran juntas, a mano, con `ng update` y PR a develop. Aplica también a las
    # actualizaciones de seguridad (que Dependabot abre contra main).
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      frontend-menores:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker)"
    labels: [dependencias, docker]

  - package-ecosystem: docker
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker)"
    labels: [dependencias, docker]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(ci)"
    labels: [dependencias, ci-cd]
