# Integración continua de GymHub (SCRUM-55)
# Corre en cada Pull Request y en cada push a develop / main.
# Si un job falla, la protección de ramas impide mergear el PR.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Permisos mínimos: el CI solo lee el código.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (sintaxis, lint, tests, auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis de todos los archivos JS
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      # Se activan solos cuando existan los scripts (SCRUM-32).
      - name: Lint
        run: npm run lint --if-present

      - name: Tests
        run: npm run test:ci --if-present

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (build, tests, auditoría)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npx ng build --configuration production

      - name: Tests unitarios
        run: npx ng test --watch=false

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Build de imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build imagen backend
        if: hashFiles('backend/Dockerfile') != ''
        run: docker build -t gymhub-backend:ci ./backend

      - name: Build imagen frontend
        if: hashFiles('frontend/Dockerfile') != ''
        run: docker build -t gymhub-frontend:ci ./frontend
